<title>시험기간 시간표</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 날짜 칩 → 강의실 격자(시간 비례) / 선생님별 목록. 직보만 주황 계열로 튀게 */
:root{
  --bg:#f5f6f8; --surface:#ffffff; --fg:#1d2330; --muted:#5d667a; --line:#dfe3ea;
  --reg-bg:#e6ecf6; --reg-bd:#b4c4e0; --reg-fg:#1f3a6b;
  --cli-bg:#e3f2ea; --cli-bd:#a9d3bb; --cli-fg:#1d5a39;
  --mrg-bg:#ece7f6; --mrg-bd:#c5b8e2; --mrg-fg:#43307a;
  --jb-bg:#ffe7d1; --jb-bd:#f0894a; --jb-fg:#7a2e00; --jb-solid:#d9531e;
  --chip:#ffffff; --chip-on:#1d2330; --chip-on-fg:#ffffff;
  --font:'Noto Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12151c; --surface:#1a1f29; --fg:#e8ebf2; --muted:#9aa3b7; --line:#2b3240;
  --reg-bg:#1e2a42; --reg-bd:#35508a; --reg-fg:#c3d3f2;
  --cli-bg:#16322433; --cli-bd:#2f6e4d; --cli-fg:#b6e3c9;
  --mrg-bg:#2a2342; --mrg-bd:#5b4a99; --mrg-fg:#d4c9f5;
  --jb-bg:#4a2810; --jb-bd:#e0702f; --jb-fg:#ffd7b8; --jb-solid:#f07a3a;
  --chip:#1a1f29; --chip-on:#e8ebf2; --chip-on-fg:#12151c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151c; --surface:#1a1f29; --fg:#e8ebf2; --muted:#9aa3b7; --line:#2b3240;
  --reg-bg:#1e2a42; --reg-bd:#35508a; --reg-fg:#c3d3f2;
  --cli-bg:#16322433; --cli-bd:#2f6e4d; --cli-fg:#b6e3c9;
  --mrg-bg:#2a2342; --mrg-bd:#5b4a99; --mrg-fg:#d4c9f5;
  --jb-bg:#4a2810; --jb-bd:#e0702f; --jb-fg:#ffd7b8; --jb-solid:#f07a3a;
  --chip:#1a1f29; --chip-on:#e8ebf2; --chip-on-fg:#12151c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);padding-inline:16px;padding-block:20px 48px;line-height:1.45}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-size:1.35rem;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:.85rem;margin:2px 0 0}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:.78rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;border:1.5px solid;vertical-align:-2px;margin-right:5px}
.tabs{display:flex;gap:6px}
.tab,.chip{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--chip);color:var(--fg);border-radius:8px}
.tab{padding:7px 14px;font-size:.88rem}
.tab[aria-selected="true"]{background:var(--chip-on);color:var(--chip-on-fg);border-color:var(--chip-on)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.chip{flex:0 0 auto;min-width:58px;padding:6px 8px;text-align:center;font-size:.8rem;line-height:1.25;position:relative}
.chip b{display:block;font-size:.95rem;font-variant-numeric:tabular-nums}
.chip[aria-selected="true"]{background:var(--chip-on);color:var(--chip-on-fg);border-color:var(--chip-on)}
.chip.past{opacity:.55}
.chip .dot{position:absolute;top:4px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--jb-solid)}
.chip.wk{color:var(--muted)}
:focus-visible{outline:2px solid var(--jb-solid);outline-offset:2px}
.dayhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.dayhead h2{font-size:1.1rem;margin:0}
.exam{font-size:.8rem;color:var(--muted)}
.exam b{color:var(--jb-solid)}
.gridbox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.grid{display:grid;grid-template-columns:44px repeat(var(--cols),minmax(104px,1fr));min-width:calc(44px + var(--cols)*104px)}
.gh{position:sticky;top:0;padding:7px 4px;text-align:center;font-size:.8rem;font-weight:700;border-bottom:1px solid var(--line);background:var(--surface);z-index:2}
.times{position:relative;height:var(--h)}
.times span{position:absolute;left:0;right:6px;text-align:right;font-size:.68rem;color:var(--muted);transform:translateY(-6px);font-variant-numeric:tabular-nums}
.times span:first-child{transform:none}
.times span:last-child{transform:translateY(-14px)}
.col{position:relative;height:var(--h);border-left:1px solid var(--line);background:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--hr) - 1px),var(--line) calc(var(--hr) - 1px),var(--line) var(--hr))}
.blk{position:absolute;left:3px;right:3px;border:1.5px solid;border-radius:6px;padding:3px 5px;overflow:hidden;font-size:.72rem;line-height:1.25}
.blk .nm{font-weight:700;display:block}
.blk .tm{opacity:.85;font-variant-numeric:tabular-nums;display:block}
.blk .tg{display:inline-block;font-size:.62rem;font-weight:700;padding:0 4px;border-radius:3px;margin-right:3px}
.k-정규,.k-정규\+클리닉{background:var(--reg-bg);border-color:var(--reg-bd);color:var(--reg-fg)}
.k-클리닉{background:var(--cli-bg);border-color:var(--cli-bd);color:var(--cli-fg)}
.k-합반,.k-클리닉\ 합반{background:var(--mrg-bg);border-color:var(--mrg-bd);color:var(--mrg-fg)}
.k-직보{background:var(--jb-bg);border-color:var(--jb-bd);color:var(--jb-fg);border-width:2px}
.tg-직보{background:var(--jb-solid);color:#fff}
.tg-o{background:rgba(127,127,127,.2)}
.noroom{display:flex;flex-wrap:wrap;gap:6px;font-size:.8rem;color:var(--muted)}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}
.tlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.tcard h3{margin:0;font-size:.95rem}
.row{display:flex;flex-direction:column;gap:1px;padding-left:9px;border-left:4px solid;border-radius:2px;min-width:0}
.row .a{font-size:.84rem;font-weight:500;overflow-wrap:anywhere}
.row .b{font-size:.76rem;color:var(--muted);font-variant-numeric:tabular-nums}
.row.k-정규,.row.k-정규\+클리닉,.row.k-클리닉,.row.k-합반,.row.k-클리닉\ 합반,.row.k-직보{background:none;color:var(--fg)}
.row.k-정규,.row.k-정규\+클리닉{border-color:var(--reg-bd)}
.row.k-클리닉{border-color:var(--cli-bd)}
.row.k-합반,.row.k-클리닉\ 합반{border-color:var(--mrg-bd)}
.row.k-직보{border-color:var(--jb-solid)}
.note{font-size:.76rem;color:var(--jb-solid)}
.foot{font-size:.78rem;color:var(--muted);display:flex;flex-direction:column;gap:3px}
</style>

  <div>

</div>

function mm(s){return +s.slice(0,2)*60+ +s.slice(3)}
function lab(d){return d.replace('-','/').replace(/^0/,'')}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
function short(n){return n.replace(/ \((?:[^()]*?)T\)/g,'').replace(/\((?:[^()]*?)T\)/g,'')}
function title(it){return it.k==='직보'?it.n:short(it.n)}
function hasJb(d){return DATA.days[d].some(function(x){return x.k==='직보'})}
function mkChips(){
  var h='';DATES.forEach(function(d){
    var w=DATA.WD[d],cl='chip'+(d<TODAY?' past':'')+((w==='토'||w==='일')?' wk':'');
    h+='<button class="'+cl+'" role="tab" data-d="'+d+'" aria-selected="'+(d===cur)+'">'+(hasJb(d)?'<span class="dot"></span>':'')+'<b>'+lab(d)+'</b>'+w+'</button>';
  });
  document.getElementById('chips').innerHTML=h;
}
function roomView(items){
  var H=(HE-HS)*PX, h='<div class="gridbox"><div class="grid" style="--cols:'+ROOMS.length+';--h:'+H+'px;--hr:'+PX+'px">';
  h+='<div class="gh"></div>';ROOMS.forEach(function(r){h+='<div class="gh">'+r+'강</div>'});
  h+='<div class="times">';for(var t=HS;t<=HE;t++){if(t>HS&&t<HE||t===HS||t===HE)h+='<span style="top:'+((t-HS)*PX)+'px">'+t+':00</span>'}h+='</div>';
  ROOMS.forEach(function(r){
    h+='<div class="col">';
    items.filter(function(x){return x.r===r}).forEach(function(x){
      var top=(mm(x.s)-HS*60)/60*PX, ht=(mm(x.e)-mm(x.s))/60*PX-2;
      var tg=x.k==='직보'?'<span class="tg tg-직보">직보</span>':(x.k!=='정규'?'<span class="tg tg-o">'+esc(x.k)+'</span>':'');
      var tm=x.s+'–'+(x.note&&x.note.indexOf('미정')>=0?'?':x.e);
      h+='<div class="blk k-'+x.k+'" style="top:'+top+'px;height:'+ht+'px" title="'+esc(title(x)+' · '+x.t.join(', ')+' · '+x.s+'–'+x.e)+'"><span class="nm">'+tg+esc(title(x))+'</span><span class="tm">'+esc(x.t.join(' · '))+'</span><span class="tm">'+tm+(x.c?' · '+x.c+'명':'')+'</span></div>';
    });
    h+='</div>';
  });
  h+='</div></div>';
  var nr=items.filter(function(x){return ROOMS.indexOf(x.r)<0});
  if(nr.length){h+='<div class="noroom"><b>원래 강의실에서 진행</b>'+nr.map(function(x){return '<span>'+esc(title(x))+' ('+x.t.join(', ')+', '+x.s+'–'+x.e+')</span>'}).join('')+'</div>'}
  return h;
}
function teacherView(items){
  var by={};items.forEach(function(x){x.t.forEach(function(t){(by[t]=by[t]||[]).push(x)})});
  var names=Object.keys(by).sort(function(a,b){return a<b?-1:1});
  var h='<div class="tlist">';
  names.forEach(function(t){
    var L=by[t].slice().sort(function(a,b){return mm(a.s)-mm(b.s)});
    h+='<div class="tcard"><h3>'+esc(t)+'T</h3>';
    L.forEach(function(x){
      var others=x.t.filter(function(y){return y!==t});
      h+='<div class="row k-'+x.k+'"><span class="a">'+(x.k==='직보'?'<span class="tg tg-직보" style="font-size:.68rem;padding:0 5px;border-radius:3px;margin-right:4px">직보</span>':'')+esc(title(x))+'</span><span class="b">'+x.s+'–'+x.e+' · '+(x.r?x.r+'강':'원래 강의실')+(x.k!=='정규'&&x.k!=='직보'?' · '+esc(x.k):'')+(x.c?' · '+x.c+'명':'')+'</span>'+(x.note?'<span class="note">'+esc(x.note)+'</span>':'')+'</div>';
    });
    h+='</div>';
  });
  return h+'</div>';
}
function render(){
  var items=DATA.days[cur];
  document.getElementById('dh').textContent=lab(cur)+'('+DATA.WD[cur]+')'+(cur<TODAY?' · 지난 일정':'');
  var ex=EXAM[cur];document.getElementById('ex').innerHTML=ex?'시험: '+ex.map(function(e){return '<b>'+esc(e[0])+'</b> '+esc(e[1])}).join(' · '):'';
  document.getElementById('view').innerHTML=items.length?(tab==='room'?roomView(items):teacherView(items)):'<div class="empty">이 날은 수업이 없습니다.</div>';
  document.getElementById('t-room').setAttribute('aria-selected',tab==='room');
  document.getElementById('t-teacher').setAttribute('aria-selected',tab==='teacher');
  [].forEach.call(document.querySelectorAll('.chip'),function(c){c.setAttribute('aria-selected',c.dataset.d===cur)});
  try{sessionStorage.setItem('tt',JSON.stringify({d:cur,t:tab}))}catch(e){}
}
document.getElementById('chips').addEventListener('click',function(e){var b=e.target.closest('.chip');if(b){cur=b.dataset.d;render()}});
document.getElementById('t-room').onclick=function(){tab='room';render()};
document.getElementById('t-teacher').onclick=function(){tab='teacher';render()};
mkChips();render();
</script>
